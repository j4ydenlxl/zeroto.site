<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fadeText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#vignette)"/>
  <ellipse cx="600" cy="315" rx="500" ry="280" fill="url(#glow)"/>

  <!-- Top-left brand mark -->
  <g transform="translate(60, 60)">
    <g transform="scale(0.13)">
      <path d="M64 64 L192 64 L232 116 L128 232 L24 116 Z" fill="none" stroke="#fff" stroke-width="14" stroke-linejoin="miter"/>
      <path d="M86 110 L170 110 L94 178 L178 178" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="square" stroke-linejoin="miter"/>
    </g>
    <text x="48" y="26" fill="#fff" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="22" letter-spacing="-0.5">zeroto.site</text>
  </g>

  <!-- Top-right meta -->
  <text x="1140" y="80" fill="#ffffff" fill-opacity="0.55" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="3" text-anchor="end">MMXXVI · VOL. 1</text>

  <!-- Headline -->
  <text x="600" y="280" fill="#fff" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="98" letter-spacing="-3" text-anchor="middle">You start with nothing.</text>
  <text x="600" y="380" fill="url(#fadeText)" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="98" letter-spacing="-3" text-anchor="middle">We deliver the site.</text>

  <!-- Tagline -->
  <text x="600" y="465" fill="#ffffff" fill-opacity="0.7" font-family="Helvetica, Arial, sans-serif" font-size="20" letter-spacing="0.5" text-anchor="middle">Lightning Fast · Tailor Made · Premium by Design</text>

  <!-- Bottom strip -->
  <text x="60" y="585" fill="#ffffff" fill-opacity="0.4" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="3">BUILDWITHZEROTO@GMAIL.COM</text>
  <text x="1140" y="585" fill="#ffffff" fill-opacity="0.4" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="3" text-anchor="end">BASED IN NEW YORK</text>
</svg>
