<!-- ============== ICONS ============== -->
<script type="text/babel">
const ArrowUpRight = ({ className = "h-4 w-4" }) => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" className={className}>
    <path d="M7 17L17 7" /><path d="M7 7h10v10" />
  </svg>
);
const Play = ({ className = "h-3.5 w-3.5" }) => (
  <svg viewBox="0 0 24 24" fill="currentColor" className={className}><polygon points="6 4 20 12 6 20 6 4" /></svg>
);
const Spark = ({ className = "h-4 w-4" }) => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.4" className={className}>
    <path d="M12 2 L13.5 10.5 L22 12 L13.5 13.5 L12 22 L10.5 13.5 L2 12 L10.5 10.5 Z" />
  </svg>
);
const Hammer = ({ className = "h-4 w-4" }) => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.4" className={className}>
    <path d="M14 6l-4 4 8 8 4-4-8-8z" /><path d="M3 21l7-7" /><path d="M9 3l6 6" />
  </svg>
);
const Bolt = ({ className = "h-4 w-4" }) => (
  <svg viewBox="0 0 24 24" fill="currentColor" className={className}><polygon points="13 2 3 14 11 14 9 22 21 10 13 10 13 2" /></svg>
);

// FadingVideo — dual-buffer crossfade. Two stacked videos with the same source.
// Videos take turns: the next buffer starts playing from 0 before the current finishes,
// then their opacities crossfade. Result: a continuous, gap-free loop.
const FadingVideo = ({ src, className = "", style, fadeMs = 700, leadSec = 1.8, blendScreen = false, fetchPriority = "auto", preload = "auto" }) => {
  const aRef = useRef(null);
  const bRef = useRef(null);
  useEffect(() => {
    const a = aRef.current, b = bRef.current;
    if (!a || !b) return;
    a.style.opacity = "1";
    b.style.opacity = "0";
    let raf = null;
    let crossfading = false;
    a.play().catch(()=>{});
    b.pause(); b.currentTime = 0;

    const fadeBetween = (from, to) => {
      if (raf) cancelAnimationFrame(raf);
      const start = performance.now();
      const fromStart = parseFloat(from.style.opacity || "1");
      const toStart = parseFloat(to.style.opacity || "0");
      const tick = (t) => {
        const p = Math.min(1, (t - start) / fadeMs);
        // Smoothstep for nicer blend curve
        const e = p * p * (3 - 2 * p);
        from.style.opacity = (fromStart * (1 - e)).toFixed(3);
        to.style.opacity   = (toStart + (1 - toStart) * e).toFixed(3);
        if (p < 1) raf = requestAnimationFrame(tick);
        else { crossfading = false; from.pause(); from.currentTime = 0; }
      };
      raf = requestAnimationFrame(tick);
    };

    const triggerCrossfade = (v) => {
      if (crossfading) return;
      const next = (v === a) ? b : a;
      crossfading = true;
      try { next.currentTime = 0; } catch (_) {}
      const p = next.play();
      if (p && p.catch) {
        p.catch(() => {
          // Buffer B can't play — restart current as fallback (hard cut beats frozen)
          crossfading = false;
          v.currentTime = 0;
          v.play().catch(() => {});
        });
      }
      fadeBetween(v, next);
    };

    const onTime = (e) => {
      const v = e.target;
      if (crossfading) return;
      if (!v.duration || isNaN(v.duration)) return;
      const remaining = v.duration - v.currentTime;
      // Removed lower bound — if remaining is tiny, still crossfade (don't let video freeze)
      if (remaining <= leadSec) {
        triggerCrossfade(v);
      }
    };

    // Hard fallback: if video reaches end, handle gracefully
    const onEnded = (e) => {
      const v = e.target;
      if (crossfading) {
        // Source video ended mid-fade — snap to final state to avoid frozen frame
        const next = (v === a) ? b : a;
        if (raf) cancelAnimationFrame(raf);
        v.style.opacity = "0";
        next.style.opacity = "1";
        v.pause();
        v.currentTime = 0;
        if (next.paused) next.play().catch(() => {});
        crossfading = false;
      } else {
        // No crossfade in progress — just restart this video (rare path)
        v.currentTime = 0;
        v.play().catch(() => {});
      }
    };

    a.addEventListener("timeupdate", onTime);
    b.addEventListener("timeupdate", onTime);
    a.addEventListener("ended", onEnded);
    b.addEventListener("ended", onEnded);

    // Pause both buffers when scrolled off-screen — saves CPU/battery
    const io = new IntersectionObserver((entries) => {
      const inView = entries[0].isIntersecting;
      if (inView) {
        const aOp = parseFloat(a.style.opacity || "0");
        const bOp = parseFloat(b.style.opacity || "0");
        if (aOp >= bOp) a.play().catch(() => {});
        else b.play().catch(() => {});
      } else {
        a.pause();
        b.pause();
      }
    }, { threshold: 0.05 });
    io.observe(a);

    return () => {
      if (raf) cancelAnimationFrame(raf);
      io.disconnect();
      a.removeEventListener("timeupdate", onTime);
      b.removeEventListener("timeupdate", onTime);
      a.removeEventListener("ended", onEnded);
      b.removeEventListener("ended", onEnded);
    };
  }, [src]);

  const cls = className + (blendScreen ? " blend-screen" : "");
  return (
    <>
      <video ref={aRef} src={src} muted playsInline preload={preload} fetchpriority={fetchPriority} className={cls} style={{ opacity: 1, ...(style || {}) }} />
      <video ref={bRef} src={src} muted playsInline preload={preload} fetchpriority={fetchPriority} className={cls} style={{ opacity: 0, ...(style || {}) }} />
    </>
  );
};
window.FadingVideo = FadingVideo;

const Plus = ({ className = "h-4 w-4" }) => (

window.Play = Play;
window.Spark = Spark;
window.Hammer = Hammer;
window.Bolt = Bolt;
window.Plus = Plus;
</script>

<!-- ============== CUSTOM CURSOR ============== -->
<script type="text/babel">
const Cursor = () => {
  const dot = useRef(null);
  const ring = useRef(null);
  useEffect(() => {
    // Skip everything on touch devices — saves a lot of CPU/battery on mobile
    if (typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(pointer: coarse)').matches) return;
    let x = 0, y = 0, rx = 0, ry = 0;
    // Lagged glass cursor — lerps slower than ring, makes spotlight feel like liquid
    let lgx = 0, lgy = 0;
    let lastSpawn = 0, lastSx = 0, lastSy = 0;
    let glassEls = null;

    const spawnParticle = (px, py) => {
      const p = document.createElement('div');
      p.className = 'diamond-particle';
      const size = 4 + Math.random() * 7;
      const dx = (Math.random() - 0.5) * 36;
      const dy = -10 - Math.random() * 30;
      const rot = (Math.random() - 0.5) * 220;
      p.style.left = px + 'px'; p.style.top = py + 'px';
      p.style.width = size + 'px'; p.style.height = size + 'px';
      p.style.setProperty('--dx', dx + 'px');
      p.style.setProperty('--dy', dy + 'px');
      p.style.setProperty('--rot', rot + 'deg');
      p.addEventListener('animationend', () => p.remove());
      document.body.appendChild(p);
    };

    const updateGlass = () => {
      if (!glassEls || glassEls.length === 0) {
        const els = document.querySelectorAll('.liquid-glass, .liquid-glass-strong');
        if (els.length > 0) glassEls = [...els];
        else return;
      }
      glassEls.forEach(el => {
        const r = el.getBoundingClientRect();
        if (r.width === 0) return;

        // Init per-element tilt state
        if (el._tx === undefined) { el._tx = 0; el._ty = 0; }

        const near = lgx >= r.left - 260 && lgx <= r.right + 260 && lgy >= r.top - 260 && lgy <= r.bottom + 260;

        if (!near) {
          el.style.setProperty('--glow', '0');
          // Lerp tilt back to zero even when cursor is away
          el._tx += (0 - el._tx) * 0.09;
          el._ty += (0 - el._ty) * 0.09;
        } else {
          el.style.setProperty('--mx', (lgx - r.left) + 'px');
          el.style.setProperty('--my', (lgy - r.top) + 'px');
          const ddx = Math.max(0, Math.max(r.left - lgx, lgx - r.right));
          const ddy = Math.max(0, Math.max(r.top - lgy, lgy - r.bottom));
          const glow = Math.max(0, 1 - Math.sqrt(ddx*ddx + ddy*ddy) / 260);
          el.style.setProperty('--glow', glow.toFixed(3));

          // 3D tilt — only for elements explicitly marked with data-tilt
          if (el.dataset.tilt) {
            const cx = r.left + r.width / 2;
            const cy = r.top + r.height / 2;
            const tx = ((lgx - cx) / (r.width / 2)) * 2;
            const ty = -((lgy - cy) / (r.height / 2)) * 2;
            el._tx += (tx - el._tx) * 0.1;
            el._ty += (ty - el._ty) * 0.1;
          } else {
            el._tx += (0 - el._tx) * 0.1;
            el._ty += (0 - el._ty) * 0.1;
          }
        }

        // Apply tilt — threshold avoids jitter near zero
        if (Math.abs(el._tx) > 0.04 || Math.abs(el._ty) > 0.04) {
          el.style.transform = `perspective(900px) rotateX(${el._ty.toFixed(3)}deg) rotateY(${el._tx.toFixed(3)}deg)`;
        } else {
          el._tx = 0; el._ty = 0;
          el.style.transform = '';
        }
      });
    };

    const onMove = (e) => {
      x = e.clientX; y = e.clientY;
      if (dot.current) dot.current.style.transform = `translate(${x}px, ${y}px) translate(-50%,-50%)`;
      const now = performance.now();
      const dist = Math.hypot(x - lastSx, y - lastSy);
      if (now - lastSpawn > 70 && dist > 6) {
        spawnParticle(x + (Math.random() - 0.5) * 10, y + (Math.random() - 0.5) * 10);
        lastSpawn = now; lastSx = x; lastSy = y;
      }
      // Invalidate glass cache when content changes (e.g. after load)
      if (glassEls && glassEls.some(el => !el.isConnected)) glassEls = null;
    };

    const tick = () => {
      rx += (x - rx) * 0.18; ry += (y - ry) * 0.18;
      // Glass lag: slower lerp = viscous liquid feel
      lgx += (x - lgx) * 0.065; lgy += (y - lgy) * 0.065;
      if (ring.current) ring.current.style.transform = `translate(${rx}px, ${ry}px) translate(-50%,-50%)`;
      updateGlass();
      requestAnimationFrame(tick);
    };

    const enter = () => ring.current && ring.current.classList.add('hover');
    const leave = () => ring.current && ring.current.classList.remove('hover');
    window.addEventListener('mousemove', onMove);
    document.querySelectorAll('a,button,details summary,[data-cursor]').forEach(el => {
      el.addEventListener('mouseenter', enter); el.addEventListener('mouseleave', leave);
    });
    const raf = requestAnimationFrame(tick);
    return () => { window.removeEventListener('mousemove', onMove); cancelAnimationFrame(raf); };
  }, []);
  return (<>
    <div ref={dot} className="cursor-dot" />
    <div ref={ring} className="cursor-ring" />
  </>);
};
window.Cursor = Cursor;
</script>

<script type="text/babel">
const { motion } = window.Motion;

const BlurText = ({ text, delay = 0, stepMs = 110, className = "", center = true }) => {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const obs = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) { setInView(true); obs.disconnect(); }
    }, { threshold: 0.1 });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  const words = text.split(" ");
  return (
    <p ref={ref} className={className} style={{ display: "flex", flexWrap: "wrap", justifyContent: center ? "center" : "flex-start", rowGap: "0.05em" }}>
      {words.map((w, i) => (
        <motion.span
          key={i}
          initial={{ filter: "blur(10px)", opacity: 0, y: 50 }}
          animate={inView ? { filter: ["blur(10px)","blur(5px)","blur(0px)"], opacity: [0,0.5,1], y: [50,-5,0] } : {}}
          transition={{ duration: 0.7, times: [0,0.5,1], ease: "easeOut", delay: delay + (i * stepMs) / 1000 }}
          style={{ display: "inline-block", marginRight: "0.3em" }}
        >{w}</motion.span>
      ))}
    </p>
  );
};
window.BlurText = BlurText;
</script>

<script type="text/babel">

<script type="text/babel">
const { AnimatePresence: AP } = window.Motion;

const App = () => {
  const [loading, setLoading] = useState(true);

  // Pause off-screen plain <video> elements after content mounts
  useEffect(() => {
    if (loading) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const v = entry.target;
        // Skip videos managed by FadingVideo (they have their own observer)
        if (v.dataset.fading) return;
        if (entry.isIntersecting) v.play().catch(() => {});
        else v.pause();
      });
    }, { threshold: 0.05 });
    // Observe all plain videos that aren't managed by FadingVideo
    const timer = setTimeout(() => {
      document.querySelectorAll('video').forEach(v => {
        // Heuristic: FadingVideo creates two stacked videos with same src,
        // detect them by checking for siblings with same src
        const siblings = Array.from(v.parentElement?.querySelectorAll('video') || []);
        const isManaged = siblings.length > 1 && siblings.every(s => s.src === v.src);
        if (!isManaged) io.observe(v);
      });
    }, 200);
    return () => { clearTimeout(timer); io.disconnect(); };
  }, [loading]);

  return (
    <>
      <Cursor />
      <AP>
        {loading && <LoadingScreen key="loader" onDone={() => setLoading(false)} />}
      </AP>
      {!loading && (
        <>
          <Navbar />
          <Hero />
          <Marquee />
          <StoneSection />
          <Capabilities />
          {/* <SelectedWork /> — uncomment when you have real client work to show */}
          <ProcessTimeline />
          <Pricing />
          <TestimonialStats />
          <FAQ />
          <InquiryForm />
          <FinalCTA />
          <Footer />
        </>
      )}
    </>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

const _err = console.error;
console.error = (...a) => {
  if (typeof a[0] === "string" && /Each child in a list/.test(a[0])) return;
  _err(...a);
};
</script>
